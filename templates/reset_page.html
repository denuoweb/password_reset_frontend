<!-- templates/reset_page.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset</title>
    <style>
        /* These styles are placeholders. Replace with actual styles from the college's website or your own custom styles */
        body {
            background-image: url('https://www.lanecc.edu/sites/default/files/styles/homehero_lg/public/homepage/CurrentSpringHero2023.jpg');
            background-size: cover;
            background-repeat: no-repeat;
            font-family: sans-serif;
        }
        .container {
            padding: 20px;
            background-color: white;
            border-radius: 18px;
            margin: auto;
            width: 50%;
            margin-top: 10%;
        }
        h1 {
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
    <h2>Reset Your Password</h2>
        <form action="{{ url_for('reset', token=token) }}" method="post">
        <label for="new_password">New Password:</label>
        <input type="password" id="new_password" name="new_password" required><br><br>

        <label for="confirm_password">Confirm New Password:</label>
        <input type="password" id="confirm_password" name="confirm_password" required><br><br>

        <input type="submit" value="Reset Password">
        </form>
    </div>
</body>
</html>
