<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LCC Password Reset</title>
    <style>
        /* These styles are placeholders. Replace with actual styles from the college's website or your own custom styles */
        body {
            background-image: url('https://www.lanecc.edu/sites/default/files/styles/homehero_lg/public/homepage/CurrentSpringHero2023.jpg');
            background-size: cover;
            background-repeat: no-repeat;
            font-family: sans-serif;
        }
        .container {
            padding: 20px;
            background-color: white;
            border-radius: 18px;
            margin: auto;
            width: 50%;
            margin-top: 10%;
        }
        h1 {
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>LCC CIT Password Reset</h1>
        <p>Enter your Lane Community College email address to reset your CIT password.</p>
        <form action="/submit" method="post">
            <label for="email"><b>Enter LCC email:</b></label>
            <input type="email" id="email" name="email" pattern=".*@(my\.)?lanecc\.edu$" required>
            <input type="submit" value="Submit">
        </form>
    </div>
</body>
</html>
